<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c3d44"/>
      <stop offset="100%" stop-color="#232428"/>
    </linearGradient>
    <linearGradient id="lensOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd3db"/>
      <stop offset="50%" stop-color="#80848f"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="80%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Camera Body -->
  <g filter="url(#shadow)">
    <!-- Viewfinder hump -->
    <path d="M185 130 H327 Q337 130 342 140 L358 165 H154 L170 140 Q175 130 185 130 Z" fill="#2d2e33"/>
    <!-- Main body -->
    <rect x="80" y="160" width="352" height="230" rx="36" fill="url(#bodyGrad)" stroke="#4f515a" stroke-width="2"/>
    <!-- Textured grip panel -->
    <rect x="100" y="180" width="312" height="190" rx="20" fill="#1b1c20" opacity="0.6"/>
  </g>

  <!-- Flash LED -->
  <circle cx="365" cy="205" r="18" fill="#44464f" stroke="#2a2b30" stroke-width="3"/>
  <circle cx="365" cy="205" r="11" fill="#fde047" opacity="0.9"/>

  <!-- Shutter / Red light -->
  <circle cx="145" cy="205" r="12" fill="#ef4444"/>
  <circle cx="143" cy="203" r="4" fill="#fca5a5" opacity="0.8"/>

  <!-- Central Lens -->
  <!-- Outer chrome bezel -->
  <circle cx="256" cy="280" r="88" fill="url(#lensOuter)"/>
  <!-- Bezel inner shadow -->
  <circle cx="256" cy="280" r="76" fill="#18181b"/>
  <!-- Glass element -->
  <circle cx="256" cy="280" r="66" fill="url(#lensGlass)"/>
  <!-- Glare reflections -->
  <ellipse cx="232" cy="254" rx="22" ry="12" transform="rotate(-30 232 254)" fill="#ffffff" opacity="0.45"/>
  <circle cx="275" cy="305" r="8" fill="#38bdf8" opacity="0.3"/>

  <!-- Photo booth 4-color strip accent -->
  <g transform="translate(140, 420)">
    <rect x="0" y="0" width="54" height="14" rx="4" fill="#f43f5e"/>
    <rect x="60" y="0" width="54" height="14" rx="4" fill="#f59e0b"/>
    <rect x="120" y="0" width="54" height="14" rx="4" fill="#10b981"/>
    <rect x="180" y="0" width="54" height="14" rx="4" fill="#0ea5e9"/>
  </g>
</svg>
